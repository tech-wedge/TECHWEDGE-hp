<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" role="img" aria-labelledby="title description">
<title id="title">平面図（階段まわり）</title>
<desc id="description">横方向に上る階段を簡略化した平面図。段鼻を一本ずつ数えやすく表示。 階段A：幅1,200mm、12段。階段B：幅900mm、10段。各段の段鼻に幅いっぱいのノンスリップを1本ずつ設置。デモ用の架空の数字です。</desc>
